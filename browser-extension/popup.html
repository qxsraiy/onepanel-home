<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{
  --bg:#0f172a; --fg:#e8eef8; --accent:#3b82f6;
  --line:rgba(148,163,184,.18); --surface:rgba(148,163,184,.07);
  --glow:rgba(59,130,246,.35);
}
*{box-sizing:border-box}
body{
  width:340px;margin:0;padding:0;
  font:13px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei UI',sans-serif;
  background:radial-gradient(circle at 15% 0%, color-mix(in srgb,var(--bg) 82%, #fff 6%) 0%, var(--bg) 60%);
  color:var(--fg);
  -webkit-font-smoothing:antialiased;
}
.wrap{padding:16px 16px 14px}
.head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.logo{
  width:26px;height:26px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--accent) 22%, transparent);
  border:1px solid color-mix(in srgb,var(--accent) 45%, transparent);
  color:var(--accent);font-size:14px;font-weight:700;
  box-shadow:0 0 14px -3px var(--glow);
}
.title{font-size:14px;font-weight:600;letter-spacing:.2px}
.sub{font-size:10.5px;opacity:.45;margin-top:1px}
label{display:block;font-size:11px;opacity:.55;margin:10px 0 5px;letter-spacing:.2px}
input,select{
  width:100%;padding:8px 11px;border-radius:10px;
  border:1px solid var(--line);
  background:var(--surface);
  color:inherit;font:inherit;outline:none;
  transition:border-color .14s ease,box-shadow .14s ease,background .14s ease;
}
input:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%, transparent);
  background:color-mix(in srgb,var(--fg) 9%, transparent);
}
input[readonly]{opacity:.62;cursor:default}
select{appearance:none;cursor:pointer;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) calc(50% - 2px),calc(100% - 11px) calc(50% - 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
select option{background:var(--bg);color:var(--fg)}
button{
  width:100%;margin-top:14px;padding:10px;border:0;border-radius:11px;
  background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:13px;
  cursor:pointer;letter-spacing:.3px;
  box-shadow:0 4px 16px -4px var(--glow);
  transition:filter .14s ease,transform .14s ease,box-shadow .14s ease;
}
button:hover{filter:brightness(1.08);box-shadow:0 6px 20px -4px var(--glow)}
button:active{transform:scale(.985)}
button:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.msg{margin-top:11px;font-size:12px;min-height:17px;text-align:center;opacity:.9}
.ok{color:#34d399}.err{color:#f87171}.warn{color:#fbbf24}
.foot{margin-top:12px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--fg) 8%, transparent);font-size:10.5px;opacity:.4;text-align:center}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
</style></head><body>
<div class="wrap">
  <div class="head">
    <div class="logo">1</div>
    <div>
      <div class="title">保存到 OnePanel</div>
      <div class="sub" id="nodeHint">未连接节点</div>
    </div>
  </div>

  <label>名称</label><input id="name" maxlength="20" placeholder="页面标题">
  <label>地址</label><input id="url" readonly>
  <label>分组</label><select id="group"></select>
  <button id="save">保存这张卡</button>
  <div class="msg" id="msg"></div>
  <div class="foot"><a href="#" id="openOptions">设置节点与账号</a></div>
</div>
<script type="module" src="popup.js"></script>
</body></html>
