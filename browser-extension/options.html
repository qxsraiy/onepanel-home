<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{
  --bg:#0f172a; --fg:#e8eef8; --accent:#3b82f6;
  --line:rgba(148,163,184,.18); --surface:rgba(148,163,184,.07);
  --glow:rgba(59,130,246,.35);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:40px 20px;
  font:13.5px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei UI',sans-serif;
  background:radial-gradient(circle at 20% 0%, color-mix(in srgb,var(--bg) 80%, #fff 8%) 0%, var(--bg) 55%, color-mix(in srgb,var(--bg) 92%, #000) 100%);
  color:var(--fg);-webkit-font-smoothing:antialiased;
  display:flex;align-items:flex-start;justify-content:center;
}
.card{
  width:min(520px,100%);padding:26px 26px 22px;border-radius:20px;
  background:color-mix(in srgb,var(--bg) 80%, transparent);
  border:1px solid var(--line);
  backdrop-filter:blur(20px);
  box-shadow:0 32px 72px -16px rgba(0,0,0,.65);
}
.head{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.logo{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--accent) 22%, transparent);
  border:1px solid color-mix(in srgb,var(--accent) 45%, transparent);
  color:var(--accent);font-size:16px;font-weight:700;
  box-shadow:0 0 16px -3px var(--glow);
}
h2{margin:0;font-size:17px;font-weight:600}
.sub{font-size:11.5px;opacity:.45;margin:2px 0 20px}
label{display:block;font-size:11.5px;opacity:.6;margin:14px 0 6px;letter-spacing:.2px}
input{
  width:100%;padding:9px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);
  color:inherit;font:inherit;outline:none;
  transition:border-color .14s ease,box-shadow .14s ease;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%, transparent)}
.row{display:flex;gap:10px;align-items:center}
button{
  padding:10px 20px;border:0;border-radius:11px;
  background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:13px;
  cursor:pointer;box-shadow:0 4px 16px -4px var(--glow);
  transition:filter .14s ease,transform .14s ease;
}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.985)}
button.ghost{
  background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none;
}
button.ghost:hover{background:color-mix(in srgb,var(--fg) 8%, transparent)}
.msg{margin-top:12px;font-size:12.5px;min-height:18px}
.ok{color:#34d399}.err{color:#f87171}
.tip{
  margin-top:20px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--fg) 8%, transparent);
  font-size:11.5px;line-height:1.9;opacity:.5;
}
.tip code{
  font-family:ui-monospace,monospace;font-size:11px;
  background:color-mix(in srgb,var(--fg) 8%, transparent);
  padding:1px 5px;border-radius:4px;
}
</style></head><body>
<div class="card">
  <div class="head">
    <div class="logo">1</div>
    <div>
      <h2>OnePanel 扩展设置</h2>
      <div class="sub">连接你的节点，右键保存任意页面</div>
    </div>
  </div>

  <label>节点地址</label>
  <input id="url" placeholder="http://192.168.1.5:5266">
  <label>访问 token</label>
  <input id="token" placeholder="在面板「设置 → API 接口」生成">
  <label>默认分组</label>
  <input id="group" placeholder="书签">
  <div class="row" style="margin-top:16px">
    <button id="save">保存设置</button>
    <button id="test" class="ghost">测试连接</button>
  </div>
  <div class="msg" id="msg"></div>

  <div class="tip">
    <b>怎么拿 token：</b>面板 → 设置 → API 接口 → 生成 Token（形如 <code>op_xxxxx</code>）<br>
    <b>为什么不用密码：</b>Token 只能读书签，权限更小，且可随时撤销<br>
    <b>存在哪：</b>只存在本机浏览器 <code>chrome.storage.local</code>，不会同步到云端
  </div>
</div>
<script type="module" src="options.js"></script>
</body></html>
