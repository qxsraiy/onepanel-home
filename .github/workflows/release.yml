name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 3.11.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x64
          - arch: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装前端依赖并构建
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 安装后端生产依赖
        working-directory: backend
        run: |
          npm ci --omit=dev --no-audit --no-fund
          rm -rf node_modules/.cache

      - name: 生成多平台 Prisma 查询引擎
        working-directory: backend
        run: |
          # schema.prisma 里已声明 binaryTargets（debian x64 + linux-arm64）
          # 必须显式跑一次，确保两个平台的 .so.node 都在包里
          npx prisma generate
          echo "--- 生成的引擎 ---"
          ls -la node_modules/.prisma/client/ | grep -E 'libquery_engine|\.so\.node' || true
          # 强制校验：两个平台引擎都必须存在
          if [ ! -f node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node ]; then
            echo "❌ 缺少 x64 引擎"; exit 1
          fi
          if [ ! -f node_modules/.prisma/client/libquery_engine-linux-arm64-openssl-3.0.x.so.node ]; then
            echo "❌ 缺少 arm64 引擎"; exit 1
          fi
          echo "✅ 两个平台引擎都在"

      - name: 组装发布包
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "main" ]; then VER="${{ github.event.inputs.version }}"; fi
          OUT="onepanel-${VER}-${{ matrix.arch }}"
          mkdir -p "dist/$OUT"
          # 【关键】前端产物必须进 backend/public，否则装好打不开页面
          mkdir -p backend/public
          rm -rf backend/public/*
          cp -r frontend/dist/* backend/public/
          cp -r backend "dist/$OUT/backend"
          cp -r shared "dist/$OUT/shared" 2>/dev/null || true
          # 扩展源码必须在包内，否则「下载扩展包」接口 404
          cp -r browser-extension "dist/$OUT/browser-extension" 2>/dev/null || true
          cp op.sh start.sh upgrade.sh "dist/$OUT/" 2>/dev/null || true
          # schema.sql 必须进包，否则新库建不了表
          mkdir -p "dist/$OUT/backend/bin"
          cp backend/bin/schema.sql "dist/$OUT/backend/bin/schema.sql" 2>/dev/null || true
          # 裁剪：只留运行时真正需要的文件（100MB → 约 65MB）
          # 运行时只用 .prisma/client 里本架构那一个引擎；
          # prisma CLI / schema-engine / 其它架构引擎都是死重量。
          rm -rf "dist/$OUT/backend/node_modules/prisma"
          rm -rf "dist/$OUT/backend/node_modules/.bin"
          rm -f "dist/$OUT/backend/node_modules/@prisma/engines/schema-engine-"*
          if [ "${{ matrix.arch }}" = "linux-x64" ]; then
            rm -f "dist/$OUT/backend/node_modules/@prisma/engines/libquery_engine-linux-arm64-"*
            rm -f "dist/$OUT/backend/node_modules/.prisma/client/libquery_engine-linux-arm64-"*
          else
            rm -f "dist/$OUT/backend/node_modules/@prisma/engines/libquery_engine-debian-"*
            rm -f "dist/$OUT/backend/node_modules/.prisma/client/libquery_engine-debian-"*
          fi
          rm -f "dist/$OUT/backend/node_modules/.prisma/client/query-engine-windows"*
          rm -f "dist/$OUT/backend/node_modules/.prisma/client/query_engine-windows"*
          rm -f "dist/$OUT/backend/prisma/"*.db
          echo "$VER" > "dist/$OUT/.version"
          cd dist
          tar -czf "${OUT}.tar.gz" "$OUT"
          sha256sum "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256"
          SIZE_MB=$(( $(stat -c%s "${OUT}.tar.gz") / 1024 / 1024 ))
          echo "包体积：${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 99 ]; then echo "⚠️ 超过 99MB，Gitee 镜像会失败"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: dist/*.tar.gz*

  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 打包单文件版
        shell: pwsh
        run: |
          # 后端依赖（含 dev 里没有、只有运行时的部分）
          Push-Location backend
          npm ci --omit=dev --no-audit --no-fund
          npx prisma generate
          Pop-Location
          $ver = (Get-Content backend/package.json | ConvertFrom-Json).version
          $env:OP_PORTABLE_OUT = "$PWD\dist\onepanel-portable-v$ver-win-x64"
          # 走 build-portable.mjs：内部会裁剪 Prisma 冗余引擎（448MB -> 193MB）
          node scripts/build-portable.mjs
          if ($LASTEXITCODE -ne 0) { throw "build-portable 失败" }
          Compress-Archive -Path $env:OP_PORTABLE_OUT -DestinationPath "dist/onepanel-portable-v$ver-win-x64.zip" -Force
          Write-Host "便携包：$((Get-Item "dist/onepanel-portable-v$ver-win-x64.zip").Length / 1MB) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-win-x64
          path: dist/*.zip

  release:
    needs: [build, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -lh out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
          prerelease: false
